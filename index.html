<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Teleport Massive: Loop Breaker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #05060a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Courier New", monospace;
    color: #d7ecff;
    overflow: hidden;
  }
  #wrap {
    position: relative;
  }
  canvas {
    background: radial-gradient(ellipse at 50% 0%, #0c1230 0%, #05060a 70%);
    display: block;
    box-shadow: 0 0 40px rgba(80, 160, 255, 0.15);
    cursor: none;
  }
  #hud {
    position: absolute;
    top: 8px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    white-space: nowrap;
    text-shadow: 0 0 4px #000;
  }
  #hud span { pointer-events: none; }
  #hud-right { display: flex; align-items: center; gap: 7px; pointer-events: none; }
  #muteBtn {
    pointer-events: auto;
    background: none;
    border: 1px solid #3f8fd6;
    color: #d7ecff;
    font-size: 11px;
    padding: 2px 6px;
    line-height: 1.4;
    min-width: 0;
  }
  #objective {
    position: absolute;
    top: 32px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12px;
    letter-spacing: 1px;
    color: #ffe45e;
    text-shadow: 0 0 4px #000;
    pointer-events: none;
  }
  #toast {
    position: absolute;
    top: 40%;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 16px;
    letter-spacing: 2px;
    color: #7fd8ff;
    text-shadow: 0 0 8px #000;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
  }
  #toast.show { opacity: 1; }
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: rgba(2, 4, 10, 0.85);
    gap: 12px;
    padding: 20px;
    box-sizing: border-box;
    overflow-y: auto;
  }
  .screen.hidden { display: none; }
  .screen h1 { margin: 0; font-size: 24px; letter-spacing: 2px; color: #7fd8ff; }
  .screen h2 { margin: 0; font-size: 16px; letter-spacing: 2px; color: #9db3cc; }
  .screen p { margin: 0; font-size: 13px; color: #9db3cc; max-width: 380px; line-height: 1.5; }
  .panel {
    text-align: left;
    font-size: 12px;
    color: #9db3cc;
    width: 100%;
    max-width: 380px;
    border: 1px solid #234064;
    background: rgba(20, 40, 70, 0.3);
    padding: 12px 16px;
    box-sizing: border-box;
  }
  .panel div { margin-bottom: 6px; }
  .panel div:last-child { margin-bottom: 0; }
  .panel .k { color: #d7ecff; font-weight: bold; }
  button {
    font-family: inherit;
    font-size: 14px;
    padding: 8px 18px;
    background: #16345e;
    color: #d7ecff;
    border: 1px solid #3f8fd6;
    cursor: pointer;
    min-width: 220px;
  }
  button:hover { background: #1d477c; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.small { min-width: 0; font-size: 12px; padding: 4px 10px; }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    width: 100%;
    max-width: 380px;
    border: 1px solid #234064;
    background: rgba(20, 40, 70, 0.3);
    padding: 8px 12px;
    box-sizing: border-box;
    font-size: 12px;
    text-align: left;
  }
  .row .name { color: #d7ecff; font-weight: bold; }
  .row .sub { color: #6f8bab; font-size: 11px; }
  .gold { color: #ffe45e; }
  .green { color: #5eff8f; }
  .red { color: #ff5e5e; }
  .locked { opacity: 0.55; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="720"></canvas>
  <div id="hud">
    <span id="score">SIGNAL 0</span>
    <div id="hud-right">
      <span id="credits" class="gold">0 CR</span>
      <span id="missiles">MSL 0/0</span>
      <span id="special">SPC 0%</span>
      <span id="wave">CYCLE 1</span>
      <button id="muteBtn">🔊</button>
    </div>
  </div>
  <div id="objective"></div>
  <div id="toast"></div>
  <div id="screen" class="screen"></div>
  <div id="pause" class="screen hidden"></div>
</div>
<script type="module">
import { Game, Bullet, SpriteSet, circleHit, clamp, reap, VisualNovel, MusicPlayer, BestRun } from "./gamekit/gamekit.js";

const canvas = document.getElementById("game");
const W = canvas.width, H = canvas.height;

const scoreEl = document.getElementById("score");
const waveEl = document.getElementById("wave");
const creditsEl = document.getElementById("credits");
const missilesEl = document.getElementById("missiles");
const specialEl = document.getElementById("special");
const objectiveEl = document.getElementById("objective");
const toastEl = document.getElementById("toast");
const screenEl = document.getElementById("screen");
const pauseEl = document.getElementById("pause");
const muteBtn = document.getElementById("muteBtn");
const wrapEl = document.getElementById("wrap");

// ---------- persistent profile ----------
const PROFILE_KEY = "tm-loopbreaker-profile";

function defaultProfile() {
  return {
    credits: 0,
    tutorialDone: false,
    simComplete: false,
    gauntletBest: 0,
    missionsDone: [],
    parts: { cannon: 1, shield: 1, armor: 1, engine: 1, ordnance: 1 },
    gear: [],
    worthy: false,
  };
}

function loadProfile() {
  try {
    const raw = localStorage.getItem(PROFILE_KEY);
    if (raw) {
      const p = { ...defaultProfile(), ...JSON.parse(raw) };
      if (p.simComplete) p.tutorialDone = true; // pre-gauntlet profiles
      return p;
    }
  } catch (_e) { /* corrupt: start fresh */ }
  const p = defaultProfile();
  // migrate pre-profile flag from the first prototype build
  if (localStorage.getItem("tm-loopbreaker-sim-complete") === "1") {
    p.simComplete = true;
    p.tutorialDone = true;
  }
  return p;
}

function saveProfile() {
  localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
}

let profile = loadProfile();

// ---------- hangar part catalog ----------
// cost(level) is the price to go from `level` to `level + 1`.
const PART_DEFS = {
  cannon:   { name: "Front Cannon",     max: 5, cost: (l) => 250 * l, desc: (l) => `spread tier ${l}` },
  shield:   { name: "Shield Capacitor", max: 5, cost: (l) => 200 * l, desc: (l) => `${40 + 15 * (l - 1)} shield` },
  armor:    { name: "Hull Plating",     max: 5, cost: (l) => 200 * l, desc: (l) => `${80 + 20 * (l - 1)} armor` },
  engine:   { name: "Vector Engine",    max: 4, cost: (l) => 180 * l, desc: (l) => `${560 + 70 * (l - 1)} thrust` },
  ordnance: { name: "Ordnance Rack",    max: 4, cost: (l) => 220 * l, desc: (l) => `${4 + 2 * (l - 1)} missiles` },
};

const LEGENDARY_GEAR = {
  retrocausal_lens: {
    name: "Retrocausal Lens",
    desc: "Cannon rounds strike before they are fired. +50% cannon damage.",
  },
};

// ---------- engine + input ----------
const game = new Game(canvas);

const mouse = { x: W / 2, y: H - 90 };
canvas.addEventListener("mousemove", (e) => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - rect.left) * (W / rect.width);
  mouse.y = (e.clientY - rect.top) * (H / rect.height);
});

const mouseDown = { left: false };
canvas.addEventListener("contextmenu", (e) => e.preventDefault());
canvas.addEventListener("mousedown", (e) => {
  if (e.button === 0) mouseDown.left = true;
  else if (e.button === 2) fireMissile();
  else if (e.button === 1) { e.preventDefault(); fireSpecial(); }
});
canvas.addEventListener("mouseup", (e) => {
  if (e.button === 0) mouseDown.left = false;
});

// ---------- portraits (PixelLab art lands at these paths; colored initials until then) ----------
const PORTRAITS = {
  sam:        { src: "assets/portraits/sam_iker.png",       color: "#5ec8ff", initial: "S" },
  gaia:       { src: "assets/portraits/gaia.png",           color: "#c85eff", initial: "G" },
  instructor: { src: "assets/portraits/tmp_instructor.png", color: "#9db3cc", initial: "T" },
  aziah:      { src: "assets/portraits/aziah_calderon.png", color: "#ff5ec4", initial: "A" },
  lyra:       { src: "assets/portraits/lyra_caeli.png",     color: "#5eff8f", initial: "L" },
};

const vn = new VisualNovel(wrapEl, { portraits: PORTRAITS });
const music = new MusicPlayer("assets/audio/tpm-loop-theme.mp3", { storageKey: "tm-loopbreaker-muted" });
const best = new BestRun("tm-loopbreaker-best", ["score", "wave"]);

muteBtn.textContent = music.muted ? "🔇" : "🔊";
muteBtn.addEventListener("click", () => {
  muteBtn.textContent = music.toggleMute() ? "🔇" : "🔊";
});

// ---------- sprites ----------
const sprites = new SpriteSet();
sprites.set("player", "assets/sprites/signal_runner.png");
sprites.set("grunt", "assets/sprites/tmp_compliance_drone.png");
sprites.set("weaver", "assets/sprites/nexus_acolyte.png");
sprites.set("turret", "assets/sprites/gaia_relay_node.png");
sprites.set("seeker", "assets/sprites/ultimatum_seeker.png");
sprites.set("boss", "assets/sprites/tmp_censor.png");

// The vector shapes ARE the training simulation, diegetically. PixelLab art
// is the real world — so sprites only render during missions. drawEntity is
// what every entity's draw() goes through.
function simMode() { return state.mode !== "mission"; }
const realSpritesDraw = sprites.draw.bind(sprites);
sprites.draw = function (ctx, key, x, y, w, h, fallback) {
  if (simMode()) { if (fallback) fallback(ctx, x, y); return; }
  realSpritesDraw(ctx, key, x, y, w, h, fallback);
};

// ---------- difficulty ----------
// One knob per pressure axis, all driven by `cycle`. Missions ramp these
// hard; the sim's survival stage uses a fixed mid-range cycle.
function difficulty(cycle) {
  // hpMult and bulletSpeed have no ceiling — the gauntlet leans on that to be
  // technically unwinnable. Everything else saturates so late loops stay
  // readable instead of becoming a spawn-rate slideshow.
  return {
    spawnRate: Math.max(0.16, 0.85 - cycle * 0.07),
    hpMult: 1 + 0.15 * (cycle - 1),
    bulletSpeed: 1 + 0.06 * (cycle - 1),
    aimedGruntChance: Math.min(0.65, 0.12 * Math.max(0, cycle - 2)),
    formationChance: Math.min(0.45, 0.15 + 0.03 * cycle),
    formationSize: Math.min(7, 3 + Math.floor(cycle / 2)),
  };
}

// ---------- entities ----------
const SPECIAL_CHARGE_PER_KILL = 11;
const MISSILE_REGEN_SEC = 7;
const SHIELD_REGEN_DELAY = 3.0;
const SHIELD_REGEN_RATE = 14;

class Player {
  constructor() {
    this.x = W / 2;
    this.y = H - 90;
    this.r = 12;

    const p = profile.parts;
    this.speed = 560 + 70 * (p.engine - 1);
    this.maxShield = 40 + 15 * (p.shield - 1);
    this.maxArmor = 80 + 20 * (p.armor - 1);
    this.shield = this.maxShield;
    this.armor = this.maxArmor;
    this.shieldRegenTimer = 0;

    this.weaponLevel = p.cannon;
    this.cannonDmg = profile.gear.includes("retrocausal_lens") ? 15 : 10;
    this.fireCooldown = 0;
    this.fireRateMod = 1;
    this.drones = 0;
    this.droneCooldown = 0;
    this.invuln = 0;

    this.maxMissiles = 4 + 2 * (p.ordnance - 1);
    this.missiles = Math.min(3, this.maxMissiles);
    this.missileRegenTimer = MISSILE_REGEN_SEC;

    this.specialCharge = 0;
    this.maxSpecialCharge = 100;
  }

  update(dt) {
    const targetX = clamp(mouse.x, this.r, W - this.r);
    const targetY = clamp(mouse.y, this.r, H - this.r);
    const dx = targetX - this.x, dy = targetY - this.y;
    const dist = Math.hypot(dx, dy);
    const step = this.speed * dt;
    if (dist <= step) {
      this.x = targetX;
      this.y = targetY;
    } else {
      this.x += (dx / dist) * step;
      this.y += (dy / dist) * step;
    }

    this.fireCooldown -= dt;
    if (mouseDown.left && this.fireCooldown <= 0) {
      this.fireCannon();
      this.fireCooldown = 0.16 / this.fireRateMod;
    }

    if (this.drones > 0) {
      this.droneCooldown -= dt;
      if (this.droneCooldown <= 0) {
        this.fireDrones();
        this.droneCooldown = 0.5;
      }
    }

    this.missileRegenTimer -= dt;
    if (this.missileRegenTimer <= 0 && this.missiles < this.maxMissiles) {
      this.missiles++;
      this.missileRegenTimer = MISSILE_REGEN_SEC;
    }

    if (this.shieldRegenTimer > 0) {
      this.shieldRegenTimer -= dt;
    } else if (this.shield < this.maxShield) {
      this.shield = Math.min(this.maxShield, this.shield + SHIELD_REGEN_RATE * dt);
    }

    if (this.invuln > 0) this.invuln -= dt;
  }

  fireCannon() {
    const spread = Math.min(this.weaponLevel - 1, 4);
    const angles = [];
    if (spread === 0) {
      angles.push(0);
    } else {
      const spreadRad = 0.12;
      for (let i = 0; i < spread + 1; i++) {
        const t = i / spread - 0.5;
        angles.push(t * spreadRad * spread);
      }
    }
    for (const a of angles) {
      bullets.push(new Bullet(this.x, this.y - this.r, a - Math.PI / 2, 480, { color: "#5ec8ff", r: 6, dmg: this.cannonDmg }));
    }
  }

  fireDrones() {
    const offsets = [-28, 28, -46, 46];
    for (let i = 0; i < this.drones; i++) {
      bullets.push(new Bullet(this.x + offsets[i], this.y, -Math.PI / 2, 420, { color: "#5eff8f", r: 5, dmg: 8 }));
    }
  }

  gainCharge(amount) {
    this.specialCharge = Math.min(this.maxSpecialCharge, this.specialCharge + amount);
  }

  hit(dmg) {
    if (this.invuln > 0) return;
    this.shieldRegenTimer = SHIELD_REGEN_DELAY;
    if (this.shield > 0) {
      const absorbed = Math.min(this.shield, dmg);
      this.shield -= absorbed;
      dmg -= absorbed;
    }
    if (dmg > 0) {
      this.armor -= dmg;
      if (state.mode === "mission") missionState.armorDamage += dmg;
    }
    this.invuln = 0.8;
  }

  draw(ctx) {
    ctx.save();
    if (this.invuln > 0 && Math.floor(this.invuln * 20) % 2 === 0) {
      ctx.globalAlpha = 0.4;
    }
    if (this.shield > 0) {
      ctx.strokeStyle = `rgba(94, 200, 255, ${0.25 + 0.35 * (this.shield / this.maxShield)})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r + 6, 0, Math.PI * 2);
      ctx.stroke();
    }
    sprites.draw(ctx, "player", this.x, this.y, 32, 32, (ctx, x, y) => {
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = "#bfe6ff";
      ctx.beginPath();
      ctx.moveTo(0, -14);
      ctx.lineTo(10, 12);
      ctx.lineTo(0, 6);
      ctx.lineTo(-10, 12);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#3f8fd6";
      ctx.fillRect(-3, -2, 6, 10);
      ctx.restore();
    });
    ctx.restore();
  }
}

class Pickup {
  constructor(x, y, kind) {
    this.x = x; this.y = y;
    this.kind = kind;
    this.vy = 90;
    this.r = 9;
    this.dead = false;
    this.spin = 0;
    this.colors = {
      weapon: "#5ec8ff",
      drone: "#5eff8f",
      rapid: "#ffe45e",
      repair: "#ff5e5e",
      missile: "#ff8a3d",
    };
  }
  update(dt) {
    this.y += this.vy * dt;
    this.spin += dt * 4;
    if (this.y > H + 20) this.dead = true;
  }
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.spin);
    ctx.fillStyle = this.colors[this.kind];
    ctx.fillRect(-this.r, -this.r, this.r * 2, this.r * 2);
    ctx.restore();
  }
  apply(player) {
    // weapon:  retrocausal charge — widens the cannon spread (run-scoped)
    // drone:   echo drone         — adds an autofiring sidekick
    // rapid:   GAIA override      — fire faster
    // repair:  nanite reweave     — restores armor
    // missile: ordnance cache     — restocks missiles
    if (this.kind === "weapon") player.weaponLevel = Math.min(player.weaponLevel + 1, 5);
    else if (this.kind === "drone") player.drones = Math.min(player.drones + 1, 4);
    else if (this.kind === "rapid") player.fireRateMod = Math.min(player.fireRateMod + 0.25, 2.5);
    else if (this.kind === "repair") player.armor = Math.min(player.armor + 25, player.maxArmor);
    else if (this.kind === "missile") player.missiles = Math.min(player.missiles + 2, player.maxMissiles);
  }
}

class Enemy {
  constructor(type, x, diff) {
    this.type = type;
    this.x = x;
    this.y = -30;
    this.t = 0;
    this.dead = false;
    this.diff = diff || difficulty(1);
    this.fireCooldown = Math.random() * 1.2 + 0.4;

    if (type === "grunt") {
      // TMP Compliance Drone — pressure unit; at higher cycles it takes aimed potshots.
      this.r = 12; this.hp = 12; this.speed = 140; this.score = 50; this.ramDmg = 18;
      this.color = "#ff9f5e";
      this.aims = Math.random() < this.diff.aimedGruntChance;
    } else if (type === "weaver") {
      // Nexus Acolyte — sine weave, aimed twin-shot bursts.
      this.r = 13; this.hp = 20; this.speed = 110; this.score = 80; this.ramDmg = 16;
      this.color = "#ff5ec4"; this.baseX = x; this.amp = 70 + Math.random() * 40;
    } else if (type === "turret") {
      // GAIA Relay Node — parks and radiates rotating radial bursts.
      this.r = 16; this.hp = 45; this.speed = 40; this.score = 150; this.ramDmg = 22;
      this.color = "#c85eff"; this.stopY = 120 + Math.random() * 60;
    } else if (type === "seeker") {
      // Ultimatum Seeker — kamikaze dive.
      this.r = 9; this.hp = 8; this.speed = 100; this.score = 70; this.ramDmg = 26;
      this.color = "#ffe45e"; this.diveSpeed = 340;
    }
    this.hp = Math.round(this.hp * this.diff.hpMult);
  }

  update(dt, player) {
    this.t += dt;
    const bSpd = this.diff.bulletSpeed;
    if (this.type === "grunt") {
      this.y += this.speed * dt;
      if (this.aims && this.y > 0) {
        this.fireCooldown -= dt;
        if (this.fireCooldown <= 0) {
          const ang = Math.atan2(player.y - this.y, player.x - this.x);
          bullets.push(new Bullet(this.x, this.y, ang, 210 * bSpd, { color: "#ff9f5e", r: 4, hostile: true, dmg: 10 }));
          this.fireCooldown = 2.0;
        }
      }
    } else if (this.type === "weaver") {
      this.y += this.speed * dt;
      this.x = this.baseX + Math.sin(this.t * 2) * this.amp;
      this.fireCooldown -= dt;
      if (this.fireCooldown <= 0 && this.y > 0) {
        const ang = Math.atan2(player.y - this.y, player.x - this.x);
        // twin shot with slight spread — one is dodgeable, two force movement
        bullets.push(new Bullet(this.x, this.y, ang - 0.08, 250 * bSpd, { color: "#ff5ec4", r: 5, hostile: true, dmg: 12 }));
        bullets.push(new Bullet(this.x, this.y, ang + 0.08, 250 * bSpd, { color: "#ff5ec4", r: 5, hostile: true, dmg: 12 }));
        this.fireCooldown = 1.4;
      }
    } else if (this.type === "turret") {
      if (this.y < this.stopY) this.y += this.speed * dt;
      this.fireCooldown -= dt;
      if (this.fireCooldown <= 0 && this.y >= this.stopY - 1) {
        const n = 10;
        for (let i = 0; i < n; i++) {
          const ang = (i / n) * Math.PI * 2 + this.t;
          bullets.push(new Bullet(this.x, this.y, ang, 180 * bSpd, { color: "#c85eff", r: 5, hostile: true, dmg: 8 }));
        }
        this.fireCooldown = 1.6;
      }
    } else if (this.type === "seeker") {
      if (this.y < 60) {
        this.y += this.speed * dt;
      } else {
        if (this.lockAngle === undefined) {
          this.lockAngle = Math.atan2(player.y - this.y, player.x - this.x);
        }
        this.x += Math.cos(this.lockAngle) * this.diveSpeed * dt;
        this.y += Math.sin(this.lockAngle) * this.diveSpeed * dt;
      }
    }
    if (this.type !== "seeker") {
      if (this.x < this.r) this.x = this.r;
      if (this.x > W - this.r) this.x = W - this.r;
    }
    if (this.y > H + 40 || this.x < -40 || this.x > W + 40) this.dead = true;
  }

  draw(ctx) {
    sprites.draw(ctx, this.type, this.x, this.y, this.r * 2.4, this.r * 2.4, (ctx, x, y) => {
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(0, 0, this.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
  }
}

// TMP Censor-class Enforcer — the demo's boss. Lives in the `enemies` array
// so every existing collision/kill path applies; `isBoss` routes the win.
class Boss {
  constructor(diff) {
    this.type = "boss";
    this.isBoss = true;
    this.x = W / 2;
    this.y = -60;
    this.r = 34;
    this.t = 0;
    this.dead = false;
    this.diff = diff;
    this.maxHp = Math.round(750 * diff.hpMult);
    this.hp = this.maxHp;
    this.score = 1500;
    this.ramDmg = 30;
    this.color = "#ff3d5e";
    this.entryY = 110;
    this.attackTimer = 2.0;
    this.pattern = 0;
  }

  phase2() { return this.hp < this.maxHp * 0.5; }

  update(dt, player) {
    this.t += dt;
    if (this.y < this.entryY) {
      this.y += 70 * dt;
      return; // no attacks during the entrance
    }
    this.x = W / 2 + Math.sin(this.t * (this.phase2() ? 0.9 : 0.55)) * (W / 2 - 70);

    this.attackTimer -= dt;
    if (this.attackTimer > 0) return;

    const bSpd = this.diff.bulletSpeed * (this.phase2() ? 1.15 : 1);
    const p2 = this.phase2();
    if (this.pattern === 0) {
      // aimed fan
      const n = p2 ? 7 : 5;
      const base = Math.atan2(player.y - this.y, player.x - this.x);
      for (let i = 0; i < n; i++) {
        const ang = base + (i - (n - 1) / 2) * 0.14;
        bullets.push(new Bullet(this.x, this.y, ang, 260 * bSpd, { color: this.color, r: 5, hostile: true, dmg: 12 }));
      }
    } else if (this.pattern === 1) {
      // rotating radial
      const n = p2 ? 18 : 14;
      for (let i = 0; i < n; i++) {
        const ang = (i / n) * Math.PI * 2 + this.t;
        bullets.push(new Bullet(this.x, this.y, ang, 190 * bSpd, { color: "#c85eff", r: 5, hostile: true, dmg: 10 }));
      }
    } else {
      // summon escorts
      const type = p2 ? "seeker" : "grunt";
      for (let i = 0; i < (p2 ? 3 : 2); i++) {
        const e = new Enemy(type, clamp(this.x + (i - 1) * 60, 30, W - 30), this.diff);
        e.y = this.y + 20;
        enemies.push(e);
      }
    }
    this.pattern = (this.pattern + 1) % 3;
    this.attackTimer = (p2 ? 1.1 : 1.7);
  }

  draw(ctx) {
    sprites.draw(ctx, "boss", this.x, this.y, this.r * 2.4, this.r * 2.4, (ctx, x, y) => {
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.moveTo(0, -this.r);
      ctx.lineTo(this.r, 0);
      ctx.lineTo(0, this.r);
      ctx.lineTo(-this.r, 0);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#0b0e18";
      ctx.beginPath();
      ctx.arc(0, 0, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = this.phase2() ? "#ffe45e" : "#c85eff";
      ctx.beginPath();
      ctx.arc(0, 0, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
  }
}

// ---------- shared combat state ----------
let player, bullets, enemies, pickups, particles;
let score;

const state = {
  mode: "title",   // "title" | "sim" | "mission"
  paused: false,
  combat: false,   // false while VN / screens are up
};

function combatLive() {
  return (state.mode === "sim" || state.mode === "mission") && state.combat && !state.paused;
}

function resetCombat() {
  player = new Player();
  bullets = [];
  enemies = [];
  pickups = [];
  particles = [];
  score = 0;
  scoreEl.textContent = "SIGNAL 0";
}

function explode(x, y, color) {
  for (let i = 0; i < 10; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = 60 + Math.random() * 120;
    particles.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      life: 0.4 + Math.random() * 0.3,
      color,
    });
  }
}

function maybeDrop(x, y) {
  if (Math.random() < 0.22) {
    const kinds = ["weapon", "drone", "rapid", "repair", "missile", "missile"];
    const kind = kinds[Math.floor(Math.random() * kinds.length)];
    pickups.push(new Pickup(x, y, kind));
  }
}

let toastTimer = null;
function toast(msg, ms = 1600) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), ms);
}

// ---------- ordnance + special ----------
function fireMissile() {
  if (!combatLive() || !player || player.missiles <= 0) return;
  player.missiles--;
  bullets.push(new Bullet(player.x, player.y - player.r, -Math.PI / 2, 380, { color: "#ff8a3d", r: 8, dmg: 45 }));
  if (state.mode === "sim") simState.missilesFired++;
}

function fireSpecial() {
  if (!combatLive() || !player || player.specialCharge < player.maxSpecialCharge) return;
  player.specialCharge = 0;
  player.invuln = Math.max(player.invuln, 1.5);
  for (const b of bullets) {
    if (b.hostile) b.dead = true;
  }
  for (const e of enemies) {
    if (e.dead) continue;
    e.hp -= 60;
    explode(e.x, e.y, "#7fd8ff");
    if (e.hp <= 0) killEnemy(e, false);
  }
  explode(player.x, player.y, "#7fd8ff");
  if (state.mode === "sim") simState.specialsUsed++;
  toast("LOOP REWIND");
}

function killEnemy(e, giveCharge = true) {
  e.dead = true;
  score += e.score;
  scoreEl.textContent = "SIGNAL " + score;
  explode(e.x, e.y, e.color);
  maybeDrop(e.x, e.y);
  if (giveCharge && player) player.gainCharge(SPECIAL_CHARGE_PER_KILL);
  if (state.mode === "sim") { simState.kills++; simState.totalKills++; }
  if (state.mode === "mission") {
    missionState.kills++;
    if (e.type === "turret") missionState.turretKills++;
    if (e.isBoss) {
      missionState.bossDead = true;
      // a boss goes out loud
      for (let i = 0; i < 6; i++) {
        explode(e.x + (Math.random() - 0.5) * 60, e.y + (Math.random() - 0.5) * 60, e.color);
      }
    }
  }
}

// ---------- training sim ----------
// Two-part structure:
//   1. Teaching stages (first run only) — death just resets you in place.
//   2. The GAUNTLET — endless loops, each harder than the last, technically
//      unwinnable. The score is how many loops you survive with the ship
//      configuration you brought in. Death ends the run and shows results.
const GAUNTLET_LOOP_SEC = 20;
const GAUNTLET_MILESTONE_LOOP = 3; // reach this once to unlock the real world

const simState = {
  stage: 0,          // index into SIM_STAGES during teaching; -1 once in gauntlet
  inGauntlet: false,
  loop: 1,
  loopTimer: 0,
  waypoints: [],
  kills: 0,
  totalKills: 0,
  missilesFired: 0,
  specialsUsed: 0,
  spawnTimer: 0,
  deaths: 0,
};

const SIM_STAGES = [
  {
    id: "move",
    objective: () => `FLIGHT CHECK — reach the markers (${simState.waypoints.length} left)`,
    brief: [
      { speaker: "TMP INSTRUCTOR", portrait: "instructor", color: "#9db3cc", text: "Simulation online. This is a TMP-certified training environment, Detective Iker. Nothing here can kill you. Permanently." },
      { speaker: "SAM IKER", portrait: "sam", color: "#5ec8ff", text: "Comforting." },
      { speaker: "TMP INSTRUCTOR", portrait: "instructor", color: "#9db3cc", text: "Your ship follows your hand. Reach the five markers." },
    ],
    init: () => {
      simState.waypoints = [];
      for (let i = 0; i < 5; i++) {
        simState.waypoints.push({
          x: 60 + Math.random() * (W - 120),
          y: 100 + Math.random() * (H - 260),
        });
      }
    },
    tick: () => {
      simState.waypoints = simState.waypoints.filter((wp) => {
        if (Math.hypot(wp.x - player.x, wp.y - player.y) < 26) {
          explode(wp.x, wp.y, "#5eff8f");
          return false;
        }
        return true;
      });
    },
    done: () => simState.waypoints.length === 0,
  },
  {
    id: "cannon",
    objective: () => `CANNON — hold LEFT CLICK. Destroy drones (${simState.kills}/8)`,
    brief: [
      { speaker: "TMP INSTRUCTOR", portrait: "instructor", color: "#9db3cc", text: "Front cannon. Hold your primary trigger — left click. It does not fire itself. Nothing in this universe does." },
    ],
    init: () => { simState.kills = 0; simState.spawnTimer = 0; },
    tick: (dt) => {
      simState.spawnTimer -= dt;
      if (simState.spawnTimer <= 0 && enemies.length < 5) {
        enemies.push(new Enemy("grunt", 30 + Math.random() * (W - 60), difficulty(1)));
        simState.spawnTimer = 0.7;
      }
    },
    done: () => simState.kills >= 8,
  },
  {
    id: "missile",
    objective: () => `ORDNANCE — RIGHT CLICK a missile into the relay nodes (${simState.kills}/2)`,
    brief: [
      { speaker: "TMP INSTRUCTOR", portrait: "instructor", color: "#9db3cc", text: "Relay nodes shrug off cannon fire. Right click launches a missile — 45 breach damage, limited stock. Watch the MSL counter. Ordnance caches restock it." },
    ],
    init: () => {
      simState.kills = 0;
      player.missiles = player.maxMissiles;
      enemies.push(new Enemy("turret", W * 0.3, difficulty(1)));
      enemies.push(new Enemy("turret", W * 0.7, difficulty(1)));
    },
    tick: () => {
      // keep two nodes on the field until the quota is met
      const turrets = enemies.filter((e) => e.type === "turret" && !e.dead).length;
      if (turrets < 2 && simState.kills < 2) {
        enemies.push(new Enemy("turret", 60 + Math.random() * (W - 120), difficulty(1)));
      }
    },
    done: () => simState.kills >= 2,
  },
  {
    id: "special",
    objective: () => `SPECIAL — kill to charge SPC, then MIDDLE CLICK (${simState.specialsUsed}/1)`,
    brief: [
      { speaker: "TMP INSTRUCTOR", portrait: "instructor", color: "#9db3cc", text: "Last system. Kills charge the Loop Rewind. At 100%, middle click rewinds your local loop — wipes hostile fire, hits everything on screen. Use it when the wall closes in." },
      { speaker: "SAM IKER", portrait: "sam", color: "#5ec8ff", text: "You built a weapon out of the thing that keeps us caged. Cute." },
    ],
    init: () => { simState.specialsUsed = 0; simState.spawnTimer = 0; player.specialCharge = 60; },
    tick: (dt) => {
      simState.spawnTimer -= dt;
      if (simState.spawnTimer <= 0 && enemies.length < 7) {
        const type = Math.random() < 0.5 ? "grunt" : "weaver";
        enemies.push(new Enemy(type, 30 + Math.random() * (W - 60), difficulty(2)));
        simState.spawnTimer = 0.55;
      }
    },
    done: () => simState.specialsUsed >= 1,
  },
];

function startSim() {
  state.mode = "sim";
  state.combat = false;
  simState.deaths = 0;
  simState.totalKills = 0;
  resetCombat();
  hideScreens();
  music.playFromGesture();
  if (profile.tutorialDone) {
    // Veterans skip class and walk straight into the meat grinder.
    beginGauntlet(true);
  } else {
    simState.stage = 0;
    simState.inGauntlet = false;
    waveEl.textContent = "SIM";
    beginSimStage();
  }
}

function beginSimStage() {
  const stage = SIM_STAGES[simState.stage];
  bullets = [];
  enemies = [];
  pickups = [];
  stage.init();
  vn.play(stage.brief, () => { state.combat = true; });
}

function simRespawn() {
  simState.deaths++;
  player.shield = player.maxShield;
  player.armor = player.maxArmor;
  player.invuln = 2.0;
  player.x = W / 2;
  player.y = H - 90;
  for (const b of bullets) if (b.hostile) b.dead = true;
  toast("SIMULATION RESET — AGAIN.", 1800);
}

function advanceSimStage() {
  simState.stage++;
  if (simState.stage >= SIM_STAGES.length) {
    // Teaching is over. The gauntlet begins.
    profile.tutorialDone = true;
    saveProfile();
    beginGauntlet(false);
  } else {
    state.combat = false;
    beginSimStage();
  }
}

function beginGauntlet(skipBrief) {
  simState.inGauntlet = true;
  simState.stage = -1;
  simState.loop = 1;
  simState.loopTimer = GAUNTLET_LOOP_SEC;
  simState.spawnTimer = 0;
  bullets = [];
  enemies = [];
  pickups = [];
  if (player) { player.x = W / 2; player.y = H - 90; }
  waveEl.textContent = "LOOP 1";
  const brief = skipBrief
    ? [{ speaker: "TMP INSTRUCTOR", portrait: "instructor", color: "#9db3cc", text: `Gauntlet online. Best: ${profile.gauntletBest} loops. It only gets worse from here. It always does.` }]
    : [
        { speaker: "TMP INSTRUCTOR", portrait: "instructor", color: "#9db3cc", text: "Coursework complete. What remains is the gauntlet. Every loop is harder than the last. There is no final loop. Nobody clears it." },
        { speaker: "SAM IKER", portrait: "sam", color: "#5ec8ff", text: "Then what's the point?" },
        { speaker: "TMP INSTRUCTOR", portrait: "instructor", color: "#9db3cc", text: "To see how far you get before the loop closes. Which, Detective, is also the point of everything else." },
      ];
  vn.play(brief, () => { state.combat = true; });
}

function gauntletSpawn(dt) {
  simState.spawnTimer -= dt;
  const diff = difficulty(simState.loop + 1);
  if (simState.spawnTimer <= 0) {
    if (Math.random() < diff.formationChance) {
      const spacing = 46;
      const originX = 60 + Math.random() * (W - 120);
      const ftype = simState.loop >= 3 && Math.random() < 0.5 ? "seeker" : "grunt";
      for (let i = 0; i < diff.formationSize; i++) {
        const e = new Enemy(ftype, clamp(originX + (i - (diff.formationSize - 1) / 2) * spacing, 20, W - 20), diff);
        e.y = -30 - i * 26;
        enemies.push(e);
      }
    } else {
      const pool = simState.loop >= 3 ? ["grunt", "weaver", "turret", "seeker"]
        : simState.loop >= 2 ? ["grunt", "weaver", "turret"]
        : ["grunt", "grunt", "weaver"];
      enemies.push(new Enemy(pool[Math.floor(Math.random() * pool.length)], 30 + Math.random() * (W - 60), diff));
    }
    simState.spawnTimer = diff.spawnRate;
  }
}

function gauntletEnd() {
  state.combat = false;
  const loops = simState.loop;
  const newBest = loops > profile.gauntletBest;
  if (newBest) profile.gauntletBest = loops;

  const firstMilestone = !profile.simComplete && loops >= GAUNTLET_MILESTONE_LOOP;
  if (firstMilestone) profile.simComplete = true;
  saveProfile();

  const showResults = () => showGauntletResults({ loops, newBest, firstMilestone });
  if (firstMilestone) {
    vn.play(
      [
        { speaker: "TMP INSTRUCTOR", portrait: "instructor", color: "#9db3cc", text: `Loop ${loops}. That clears TMP's field threshold. Telemetry logged.` },
        { speaker: "SAM IKER", portrait: "sam", color: "#5ec8ff", text: "So do I pass?" },
        { speaker: "TMP INSTRUCTOR", portrait: "instructor", color: "#9db3cc", text: "Ready for the real world, Sam?" },
      ],
      showResults
    );
  } else {
    showResults();
  }
}

function updateSim(dt) {
  if (simState.inGauntlet) {
    simState.loopTimer -= dt;
    if (simState.loopTimer <= 0) {
      simState.loop++;
      simState.loopTimer = GAUNTLET_LOOP_SEC;
      waveEl.textContent = "LOOP " + simState.loop;
      toast(`LOOP ${simState.loop}`, 1200);
    }
    gauntletSpawn(dt);
    updateCombat(dt);
    objectiveEl.textContent = `GAUNTLET — LOOP ${simState.loop} · best ${Math.max(profile.gauntletBest, 0)} · next in ${Math.max(0, Math.ceil(simState.loopTimer))}s`;
    if (player.armor <= 0) gauntletEnd();
    return;
  }

  const stage = SIM_STAGES[simState.stage];
  stage.tick(dt);
  updateCombat(dt);
  objectiveEl.textContent = stage.objective();

  if (player.armor <= 0) {
    simRespawn();
    return;
  }
  if (stage.done()) advanceSimStage();
}

// ---------- missions (Armored Core structure) ----------
const MISSIONS = [
  {
    id: "m1",
    name: "SIGNAL ESCORT",

      ? `CENSOR-CLASS ENFORCER — destroy it`
      : `ESCORT — hold the corridor (${Math.max(0, Math.ceil(missionState.timer))}s)`,
    init: () => { missionState.timer = 60; },
    tick: (dt) => {
      if (!missionState.bossActive) {
        missionState.timer -= dt;
        if (missionState.timer <= 0) {
          missionState.bossActive = true;
          toast("WARNING — CENSOR-CLASS ENFORCER", 2400);
          enemies.push(new Boss(difficulty(missionState.cycle)));
        }
      }

    tick: () => {},
    done: () => missionState.turretKills >= 8,

    cyclesRamp: true,
  },
  {

const missionState = {
  def: null,
  timer: 0,
  kills: 0,
  turretKills: 0,
  armorDamage: 0,
  cycle: 1,
  cycleTimer: 0,
  spawnTimer: 0,
  turretBias: false,
  bossActive: false,
  bossDead: false,
};

const MISSION_CUTSCENES = {
  3: [
    { speaker: "AZIAH CALDERON", portrait: "aziah", color: "#ff5ec4", text: "Teleport Massive didn't build the cage. They just found the door and locked it from the outside." },
    { speaker: "SAM IKER", portrait: "sam", color: "#5ec8ff", text: "So unlock it." },
    { speaker: "AZIAH CALDERON", portrait: "aziah", color: "#ff5ec4", text: "I tried. That's how the Order of the Nexus got its first martyr." },
  ],
  6: [
    { speaker: "SAM IKER", portrait: "sam", color: "#5ec8ff", text: "Every case I close, I've already closed. Doesn't make the closing feel any less like the first time." },
    { speaker: "LYRA CAELI", portrait: "lyra", color: "#5eff8f", text: "Perhaps that repetition is the only proof you were ever really there." },
  ],
  9: [
    { speaker: "GAIA", portrait: "gaia", color: "#c85eff", text: "Your soul resets to the coordinates of your birth. This is not new information." },
    { speaker: "SAM IKER", portrait: "sam", color: "#5ec8ff", text: "No. But it's the first time I've said it back to you." },
  ],
};

function startMission(def) {
  state.mode = "mission";
  state.combat = false;
  missionState.def = def;
  missionState.kills = 0;
  missionState.turretKills = 0;
  missionState.armorDamage = 0;
  missionState.cycle = def.startCycle;
  missionState.cycleTimer = 0;
  missionState.spawnTimer = 0;
  missionState.turretBias = false;
  missionState.bossActive = false;
  missionState.bossDead = false;
  resetCombat();
  hideScreens();
  def.init();
  waveEl.textContent = "CYCLE " + missionState.cycle;
  music.playFromGesture();
  vn.play(
    [
      { speaker: "GAIA", portrait: "gaia", color: "#c85eff", text: "The future creates the past. You have done this before. You will do it again." },
      { speaker: "SAM IKER", portrait: "sam", color: "#5ec8ff", text: "Then it costs nothing to run it one more time." },
    ],
    () => { state.combat = true; }
  );
}

function updateMission(dt) {
  const def = missionState.def;

  // cycle escalation (paused during the boss fight — no cutscene ambushes)
  if (def.cyclesRamp && !missionState.bossActive) {
    missionState.cycleTimer += dt;
    if (missionState.cycleTimer > 20) {
      missionState.cycleTimer = 0;
      missionState.cycle++;
      waveEl.textContent = "CYCLE " + missionState.cycle;
      const cs = MISSION_CUTSCENES[missionState.cycle];
      if (cs) {
        state.combat = false;
        vn.play(cs, () => { state.combat = true; });
        return;
      }
    }
  }

  // spawning — the Censor controls the field alone; it summons its own escorts
  const diff = difficulty(missionState.cycle);
  missionState.spawnTimer -= dt;
  if (missionState.spawnTimer <= 0 && !missionState.bossActive) {
    if (Math.random() < diff.formationChance) {
      const spacing = 46;
      const originX = 60 + Math.random() * (W - 120);
      const ftype = missionState.cycle >= 4 && Math.random() < 0.5 ? "seeker" : "grunt";
      for (let i = 0; i < diff.formationSize; i++) {
        const e = new Enemy(ftype, clamp(originX + (i - (diff.formationSize - 1) / 2) * spacing, 20, W - 20), diff);
        e.y = -30 - i * 26;
        enemies.push(e);
      }
    } else {
      let pool = missionState.cycle >= 4 ? ["grunt", "weaver", "turret", "seeker"]
        : missionState.cycle >= 3 ? ["grunt", "weaver", "turret"]
        : missionState.cycle >= 2 ? ["grunt", "weaver"]
        : ["grunt", "grunt", "weaver"];
      if (missionState.turretBias) pool = pool.concat(["turret", "turret"]);
      enemies.push(new Enemy(pool[Math.floor(Math.random() * pool.length)], 30 + Math.random() * (W - 60), diff));
    }
    missionState.spawnTimer = diff.spawnRate;
  }

  def.tick(dt);
  updateCombat(dt);
  objectiveEl.textContent = def.objective();

  if (player.armor <= 0) {
    missionEnd(false);
    return;
  }
  if (def.done()) missionEnd(true);
}

function missionEnd(success) {
  state.combat = false;
  const def = missionState.def;
  const worthy = success && missionState.armorDamage === 0;
  let earned = 0;
  let grantedGear = null;

  if (success) {
    earned = def.reward + (worthy ? def.worthyBonus : 0);
    if (!profile.missionsDone.includes(def.id)) profile.missionsDone.push(def.id);
    if (worthy && !profile.gear.includes("retrocausal_lens") && profile.missionsDone.includes("m2")) {
      profile.gear.push("retrocausal_lens");
      grantedGear = LEGENDARY_GEAR.retrocausal_lens;
      profile.worthy = true;
    }
  } else {
    earned = Math.floor(def.reward * 0.15);
  }
  profile.credits += earned;
  saveProfile();
  best.report({ score, wave: missionState.cycle });

  showMissionResults({ success, def, earned, worthy, grantedGear });
}

// ---------- shared combat update ----------
function updateCombat(dt) {
  player.update(dt);

  const bounds = { w: W, h: H };
  for (const b of bullets) b.update(dt, bounds);
  for (const e of enemies) e.update(dt, player);
  for (const p of pickups) p.update(dt);
  for (const pt of particles) {
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.life -= dt;
  }

  for (const b of bullets) {
    if (b.hostile || b.dead) continue;
    for (const e of enemies) {
      if (e.dead) continue;
      if (circleHit(b, e)) {
        b.dead = true;
        e.hp -= b.dmg || 10;
        if (e.hp <= 0) killEnemy(e);
        break;
      }
    }
  }

  for (const b of bullets) {
    if (!b.hostile || b.dead) continue;
    if (circleHit(b, player)) {
      b.dead = true;
      player.hit(b.dmg || 12);
    }
  }

  for (const e of enemies) {
    if (e.dead) continue;
    if (circleHit(e, player)) {
      e.dead = true;
      player.hit(e.ramDmg || 20);
      explode(e.x, e.y, e.color);
    }
  }

  for (const p of pickups) {
    if (p.dead) continue;
    if (circleHit(p, player)) {
      p.dead = true;
      p.apply(player);
    }
  }

  bullets = reap(bullets);
  enemies = reap(enemies);
  pickups = reap(pickups);
  particles = particles.filter((p) => p.life > 0);

  missilesEl.textContent = `MSL ${player.missiles}/${player.maxMissiles}`;
  specialEl.textContent = player.specialCharge >= player.maxSpecialCharge ? "SPC READY" : `SPC ${Math.floor(player.specialCharge)}%`;
}

// ---------- game loop ----------
game.onUpdate = (dt) => {
  if (!combatLive()) return;
  if (state.mode === "sim") updateSim(dt);
  else if (state.mode === "mission") updateMission(dt);
};

game.onDraw = (ctx) => {
  ctx.clearRect(0, 0, W, H);
  if (!player) return;

  // sim waypoints
  if (state.mode === "sim" && SIM_STAGES[simState.stage] && SIM_STAGES[simState.stage].id === "move") {
    for (const wp of simState.waypoints) {
      ctx.strokeStyle = "#5eff8f";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(wp.x, wp.y, 16 + Math.sin(Date.now() / 200) * 3, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / 0.6);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  for (const p of pickups) p.draw(ctx);
  for (const e of enemies) e.draw(ctx);
  for (const b of bullets) b.draw(ctx);
  if (state.mode !== "title") player.draw(ctx);

  // armor (bottom) + shield (above)
  ctx.fillStyle = "#222";
  ctx.fillRect(10, H - 18, 120, 8);
  ctx.fillStyle = player.armor > player.maxArmor * 0.3 ? "#3f8fd6" : "#ff5e5e";
  ctx.fillRect(10, H - 18, 120 * Math.max(0, player.armor / player.maxArmor), 8);

  ctx.fillStyle = "#222";
  ctx.fillRect(10, H - 29, 120, 6);
  ctx.fillStyle = "#5ec8ff";
  ctx.fillRect(10, H - 29, 120 * Math.max(0, player.shield / player.maxShield), 6);

  // boss HP bar across the top
  const boss = enemies.find((e) => e.isBoss && !e.dead);
  if (boss) {
    ctx.fillStyle = "#222";
    ctx.fillRect(40, 48, W - 80, 10);
    ctx.fillStyle = boss.phase2() ? "#ffe45e" : "#ff3d5e";
    ctx.fillRect(40, 48, (W - 80) * Math.max(0, boss.hp / boss.maxHp), 10);
    ctx.strokeStyle = "#0b0e18";
    ctx.strokeRect(40, 48, W - 80, 10);
  }
};

// ---------- screens ----------
function hideScreens() {
  screenEl.classList.add("hidden");
  pauseEl.classList.add("hidden");
  state.paused = false;
}

function refreshCreditsHud() {
  creditsEl.textContent = `${profile.credits} CR`;
}

function showTitle() {
  state.mode = "title";
  state.combat = false;
  objectiveEl.textContent = "";
  refreshCreditsHud();
  pauseEl.classList.add("hidden");
  screenEl.classList.remove("hidden");
  const missionsLocked = !profile.simComplete;
  screenEl.innerHTML = `
    <h1>TELEPORT MASSIVE</h1>
    <h2>LOOP BREAKER</h2>
    <p>Every death just resets the loop. Run it anyway.</p>
    <div class="panel">
      <div><span class="k">Move:</span> ship follows your mouse</div>
      <div><span class="k">Left click (hold):</span> front cannon</div>
      <div><span class="k">Right click:</span> missile (limited ordnance)</div>
      <div><span class="k">Middle click:</span> Loop Rewind special, once charged</div>
      <div><span class="k">ESC:</span> pause / menu</div>
    </div>
    <button id="btnSim">${profile.tutorialDone ? `Training Gauntlet — best ${profile.gauntletBest} loops` : "Enter Training Sim"}</button>
    <button id="btnMissions" ${missionsLocked ? "disabled" : ""}>${missionsLocked ? `Missions — survive ${GAUNTLET_MILESTONE_LOOP} gauntlet loops first` : "Missions"}</button>
    <button id="btnHangar">Hangar — ${profile.credits} CR</button>
  `;
  document.getElementById("btnSim").addEventListener("click", startSim);
  const bm = document.getElementById("btnMissions");
  if (!missionsLocked) bm.addEventListener("click", showMissionSelect);
  document.getElementById("btnHangar").addEventListener("click", showHangar);
}

function showGauntletResults({ loops, newBest, firstMilestone }) {
  refreshCreditsHud();
  screenEl.classList.remove("hidden");
  screenEl.innerHTML = `
    <h1>LOOP CLOSED</h1>
    <p>The gauntlet takes everyone eventually. That's what it's for.</p>
    <div class="panel">
      <div><span class="k">Loops survived:</span> ${loops}</div>
      <div><span class="k">Kills:</span> ${simState.totalKills}</div>
      <div><span class="k">Best:</span> ${profile.gauntletBest} ${newBest ? '<span class="green">NEW BEST</span>' : ""}</div>
      ${firstMilestone ? '<div class="green">FIELD THRESHOLD CLEARED — missions unlocked.</div>' : ""}
    </div>
    ${profile.simComplete ? '<button id="btnFirstMission">Enter the Real World — Missions</button>' : ""}
    <button id="btnKeepTraining">Run the Gauntlet Again</button>
    <button id="btnHangar3">Hangar</button>
    <button id="btnToTitle">Main Menu</button>
  `;
  const fm = document.getElementById("btnFirstMission");
  if (fm) fm.addEventListener("click", () => {
    if (profile.missionsDone.length === 0) startMission(MISSIONS[0]);
    else showMissionSelect();
  });
  document.getElementById("btnKeepTraining").addEventListener("click", startSim);
  document.getElementById("btnHangar3").addEventListener("click", showHangar);
  document.getElementById("btnToTitle").addEventListener("click", showTitle);
}

function showMissionSelect() {
  state.mode = "title";
  state.combat = false;
  objectiveEl.textContent = "";
  refreshCreditsHud();
  screenEl.classList.remove("hidden");
  let rows = "";
  for (const m of MISSIONS) {
    const unlocked = m.unlocked();
    const done = profile.missionsDone.includes(m.id);
    rows += `
      <div class="row ${unlocked ? "" : "locked"}">
        <div>
          <div class="name">${m.name} ${done ? '<span class="green">✓</span>' : ""}</div>
          <div class="sub">${unlocked ? m.desc : (m.lockText ? m.lockText() : "LOCKED")}</div>
          <div class="sub gold">Reward: ${m.reward} CR${m.worthyBonus ? ` (+${m.worthyBonus} if untouched)` : ""}</div>
        </div>
        <button class="small" data-mission="${m.id}" ${unlocked ? "" : "disabled"}>LAUNCH</button>
      </div>`;
  }
  screenEl.innerHTML = `
    <h1>MISSIONS</h1>
    <p>Complete contracts. Earn credits. Upgrade in the hangar. The story continues only if you are worthy.</p>
    ${rows}
    <button id="btnBack">Back</button>
  `;
  screenEl.querySelectorAll("[data-mission]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const def = MISSIONS.find((m) => m.id === btn.dataset.mission);
      if (def) startMission(def);
    });
  });
  document.getElementById("btnBack").addEventListener("click", showTitle);
}

function showMissionResults({ success, def, earned, worthy, grantedGear }) {
  refreshCreditsHud();
  screenEl.classList.remove("hidden");
  screenEl.innerHTML = `
    <h1>${success ? "MISSION COMPLETE" : "LOOP CLOSED"}</h1>
    <p>${success
      ? (worthy ? "Untouched. TMP's actuaries are uncomfortable. <span class=\"green\">WORTHY.</span>" : "Contract fulfilled. The corridor stays open one more cycle.")
      : "The Signal Runner falls. The loop resets. The contract does not."}</p>
    <div class="panel">
      <div><span class="k">${def.name}</span></div>
      <div>Signal: ${score} · Kills: ${missionState.kills} · Armor damage taken: ${missionState.armorDamage}</div>
      <div class="gold">Credits earned: ${earned} (total ${profile.credits})</div>
      ${grantedGear ? `<div class="green">LEGENDARY ACQUIRED: ${grantedGear.name} — ${grantedGear.desc}</div>` : ""}
    </div>
    <button id="btnAgain">${success ? "Next: Mission Select" : "Retry Mission"}</button>
    <button id="btnHangar2">Hangar</button>
    <button id="btnToTitle">Main Menu</button>
  `;
  document.getElementById("btnAgain").addEventListener("click", () => {
    if (success) showMissionSelect();
    else startMission(def);
  });
  document.getElementById("btnHangar2").addEventListener("click", showHangar);
  document.getElementById("btnToTitle").addEventListener("click", showTitle);
}

function showHangar() {
  state.mode = "title";
  state.combat = false;
  objectiveEl.textContent = "";
  refreshCreditsHud();
  screenEl.classList.remove("hidden");
  let rows = "";
  for (const [key, def] of Object.entries(PART_DEFS)) {
    const lvl = profile.parts[key];
    const maxed = lvl >= def.max;
    const cost = maxed ? 0 : def.cost(lvl);
    const affordable = profile.credits >= cost;
    rows += `
      <div class="row">
        <div>
          <div class="name">${def.name} <span class="sub">Lv ${lvl}/${def.max}</span></div>
          <div class="sub">${def.desc(lvl)}${maxed ? "" : ` → ${def.desc(lvl + 1)}`}</div>
        </div>
        <button class="small" data-part="${key}" ${maxed || !affordable ? "disabled" : ""}>
          ${maxed ? "MAX" : `${cost} CR`}
        </button>
      </div>`;
  }
  let gearRows = "";
  for (const [gid, g] of Object.entries(LEGENDARY_GEAR)) {
    const owned = profile.gear.includes(gid);
    gearRows += `
      <div class="row ${owned ? "" : "locked"}">
        <div>
          <div class="name gold">${g.name}</div>
          <div class="sub">${owned ? g.desc : "Legendary. Not for sale. Finish a mission untouched — be worthy."}</div>
        </div>
        <span class="${owned ? "green" : "sub"}">${owned ? "EQUIPPED" : "LOCKED"}</span>
      </div>`;
  }
  screenEl.innerHTML = `
    <h1>HANGAR</h1>
    <p class="gold">${profile.credits} CR</p>
    ${rows}
    <h2>LEGENDARY GEAR</h2>
    ${gearRows}
    <button id="btnTestConfig">Test Configuration — Training Gauntlet</button>
    <button id="btnBack">Back</button>
  `;
  document.getElementById("btnTestConfig").addEventListener("click", startSim);
  screenEl.querySelectorAll("[data-part]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const key = btn.dataset.part;
      const def = PART_DEFS[key];
      const lvl = profile.parts[key];
      const cost = def.cost(lvl);
      if (lvl >= def.max || profile.credits < cost) return;
      profile.credits -= cost;
      profile.parts[key]++;
      saveProfile();
      showHangar();
    });
  });
  document.getElementById("btnBack").addEventListener("click", showTitle);
}

// ---------- pause menu (ESC) ----------
function togglePause() {
  if (state.mode === "title" || vn.isOpen()) return;
  state.paused = !state.paused;
  if (state.paused) {
    pauseEl.classList.remove("hidden");
    pauseEl.innerHTML = `
      <h1>PAUSED</h1>
      <p>${state.mode === "sim" ? "TMP Training Simulation" : (missionState.def ? missionState.def.name : "Mission")}</p>
      <button id="btnResume">Resume</button>
      <button id="btnRestart">${state.mode === "sim" ? "Restart Gauntlet" : "Restart Mission"}</button>
      <button id="btnPauseHangar">Return to Hangar${state.mode === "mission" ? " (abort mission)" : ""}</button>
      ${state.mode === "mission" ? '<button id="btnPauseGauntlet">Training Gauntlet (abort mission)</button>' : ""}
      <button id="btnAbort">Main Menu</button>
      <button id="btnMute2">${music.muted ? "Unmute Music" : "Mute Music"}</button>
    `;
    document.getElementById("btnResume").addEventListener("click", togglePause);
    document.getElementById("btnRestart").addEventListener("click", () => {
      hideScreens();
      if (state.mode === "sim") startSim();
      else startMission(missionState.def);
    });
    document.getElementById("btnPauseHangar").addEventListener("click", () => {
      hideScreens();
      showHangar();
    });
    const pg = document.getElementById("btnPauseGauntlet");
    if (pg) pg.addEventListener("click", () => {
      hideScreens();
      startSim();
    });
    document.getElementById("btnAbort").addEventListener("click", () => {
      hideScreens();
      showTitle();
    });
    document.getElementById("btnMute2").addEventListener("click", () => {
      muteBtn.textContent = music.toggleMute() ? "🔇" : "🔊";
      document.getElementById("btnMute2").textContent = music.muted ? "Unmute Music" : "Mute Music";
    });
  } else {
    pauseEl.classList.add("hidden");
  }
}

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape") togglePause();
});

// ---------- boot ----------
// Dev handle for headless testing and balance work: only with ?debug=1.
if (new URLSearchParams(location.search).has("debug")) {
  window.__debug = {
    state, simState, missionState,
    getPlayer: () => player,
    getProfile: () => profile,
    getEnemies: () => enemies,
    advanceSimStage, startSim, startMission, MISSIONS,
    missionEnd, showTitle, beginGauntlet, gauntletEnd, Boss,
  };
}

resetCombat();
refreshCreditsHud();
showTitle();
game.start();
</script>
